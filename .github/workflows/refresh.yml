name: Refresh leaderboard
on:
  schedule:
    - cron: "*/30 11-22 * * *"   # every 30 min, 11:00–22:59 UTC — live match-day scoring
    - cron: "0 6 * * *"          # once overnight — final catch-up
  workflow_dispatch:              # ...and lets you run it manually any time
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update results & standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node refresh.mjs
      - name: Commit changes
        run: |
          git config user.name "prediction-league-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json index.html
          git commit -m "Auto-refresh leaderboard" || echo "No changes"
          git push
